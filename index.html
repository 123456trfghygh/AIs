<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мой ИИ</title>
<style>
:root{
  --bg:#0b0d12;--side:#10131a;--panel:#151923;--card:#1b2030;--line:#262c3b;
  --text:#e7e9f0;--muted:#8a92a6;--a1:#7c9cff;--a2:#b38cff;
  --grad:linear-gradient(135deg,#7c9cff,#b38cff);--danger:#ff7b8a;
  --shadow:0 10px 30px rgba(0,0,0,.35);--radius:14px;
}
[data-theme=light]{
  --bg:#f4f6fb;--side:#ffffff;--panel:#ffffff;--card:#f0f2f8;--line:#e2e6f0;
  --text:#1a1d26;--muted:#6b7280;--shadow:0 10px 30px rgba(20,30,60,.08);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit}

.app{display:flex;height:100%}

/* ---------- Sidebar ---------- */
#sidebar{width:280px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:12px;transition:transform .25s ease}
.brand{display:flex;gap:12px;align-items:center;padding:4px 2px 8px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:var(--shadow)}
.brand b{display:block;font-size:16px}
.brand small{color:var(--muted);font-size:12px}
.btn-new{padding:11px;border-radius:12px;border:none;background:var(--grad);color:#fff;font-weight:600;box-shadow:var(--shadow);transition:transform .15s,filter .15s}
.btn-new:hover{transform:translateY(-1px);filter:brightness(1.07)}
#search{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);outline:none}
#search:focus{border-color:var(--a1)}
.chat-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin:0 -6px;padding:0 6px}
.chat-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;color:var(--muted);transition:background .15s,color .15s}
.chat-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item:hover{background:var(--card);color:var(--text)}
.chat-item.active{background:var(--card);color:var(--text);box-shadow:inset 3px 0 0 var(--a1)}
.chat-item .del{opacity:0;background:none;border:none;color:var(--danger);padding:2px 6px;border-radius:6px}
.chat-item:hover .del{opacity:1}
.side-foot{display:flex;gap:8px}
.ghost{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}
.ghost:hover{color:var(--text);background:var(--card)}
.ghost.danger:hover{color:var(--danger)}
.empty-list{color:var(--muted);font-size:13px;text-align:center;padding:20px 0}

/* ---------- Main ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.icon:hover{border-color:var(--a1)}
#menuBtn{display:none}
#chatTitle{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#mode{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);outline:none;cursor:pointer}
#mode:focus{border-color:var(--a1)}

#chat{flex:1;overflow-y:auto;scroll-behavior:smooth}
#msgs{max-width:820px;margin:0 auto;padding:28px 20px 12px;display:flex;flex-direction:column;gap:22px}

/* welcome */
.welcome{margin:auto;text-align:center;padding:40px 0 10px;animation:fade .4s ease}
.welcome .big{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:28px;box-shadow:var(--shadow)}
.welcome h1{font-size:26px;margin:0 0 6px}
.welcome p{color:var(--muted);margin:0 0 26px}
.sugg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.sugg{text-align:left;padding:16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--card);color:var(--text);transition:transform .15s,border-color .15s}
.sugg:hover{transform:translateY(-2px);border-color:var(--a1)}
.sugg b{display:block;margin-bottom:4px}
.sugg small{color:var(--muted)}

/* messages */
.row{display:flex;gap:12px;animation:fade .25s ease}
.row.user{flex-direction:row-reverse}
.av{width:34px;height:34px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.row.assistant .av{background:var(--grad);color:#fff;border:none}
.bubble{max-width:min(680px,82%);padding:12px 16px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);overflow-wrap:anywhere;box-shadow:var(--shadow)}
.row.user .bubble{background:var(--grad);color:#fff;border:none;white-space:pre-wrap}
.bubble.err{border-color:var(--danger);color:var(--danger)}
.bubble h3,.bubble h4{margin:12px 0 4px}
.bubble h3{font-size:17px}.bubble h4{font-size:15px}
.bubble li{display:list-item;margin-left:22px}
.bubble strong{font-weight:700}
code.ic{background:rgba(127,140,170,.18);padding:1px 6px;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
pre{margin:10px 0;border-radius:10px;overflow:hidden;background:#0a0c11;border:1px solid var(--line)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#161a24;color:var(--muted);font-size:12px}
.copy{background:none;border:1px solid #2c3345;color:var(--muted);border-radius:6px;padding:2px 8px;font-size:12px}
.copy:hover{color:var(--text);border-color:var(--a1)}
pre code{display:block;padding:12px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;color:#d6dcf0;white-space:pre}
.retry{margin-top:10px;padding:7px 14px;border-radius:9px;border:none;background:var(--danger);color:#fff;font-weight:600}
.typing{display:inline-flex;gap:5px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.caret::after{content:"▍";color:var(--a1);animation:blink 1s steps(2) infinite;margin-left:2px}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* composer */
footer{padding:12px 20px 16px;background:linear-gradient(transparent,var(--bg) 30%)}
.composer{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow);transition:border-color .2s}
.composer:focus-within{border-color:var(--a1)}
#input{flex:1;resize:none;border:none;outline:none;background:transparent;color:var(--text);min-height:26px;max-height:200px;padding:8px 10px;font-size:16px;line-height:1.5}
#input::placeholder{color:var(--muted)}
.send{width:42px;height:42px;flex-shrink:0;border-radius:13px;border:none;background:var(--grad);color:#fff;font-size:17px;transition:transform .15s,opacity .15s}
.send:hover{transform:scale(1.05)}
.send.stop{background:var(--danger)}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}

#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}

/* ---------- Mobile ---------- */
@media (max-width:820px){
  #sidebar{position:fixed;top:0;bottom:0;left:0;z-index:20;transform:translateX(-105%);box-shadow:var(--shadow)}
  #sidebar.open{transform:none}
  #overlay.show{display:block}
  #menuBtn{display:grid}
  .sugg-grid{grid-template-columns:1fr}
  .bubble{max-width:90%}
  #msgs{padding:20px 12px 8px}
  header{padding:10px 12px}
  #mode{max-width:130px;font-size:13px;padding:7px 8px}
}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">✦</div>
      <div><b>Мой ИИ</b><small>Чаты хранятся на этом устройстве</small></div>
    </div>
    <button class="btn-new" id="newBtn">+ Новый чат</button>
    <input id="search" placeholder="Поиск по чатам">
    <div class="chat-list" id="chatList"></div>
    <div class="side-foot">
      <button class="ghost" id="themeBtn">🌓 Тема</button>
      <button class="ghost danger" id="clearBtn">Очистить всё</button>
    </div>
  </aside>
  <div id="overlay"></div>

  <main>
    <header>
      <button class="icon" id="menuBtn" aria-label="Меню">☰</button>
      <div id="chatTitle">Новый чат</div>
      <select id="mode" aria-label="Режим">
        <option value="fast">⚡ Быстрый</option>
        <option value="code">💻 Код</option>
        <option value="smart">🧠 Аналитик</option>
      </select>
      <button class="icon" id="exportBtn" title="Экспорт в .md">⤓</button>
    </header>

    <section id="chat"><div id="msgs"></div></section>

    <footer>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Напишите сообщение…"></textarea>
        <button class="send" id="sendBtn" title="Отправить">➤</button>
      </div>
      <div class="hint">Enter — отправить · Shift+Enter — новая строка</div>
    </footer>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const KEY = 'my_ai_v2';
const FIRST_TOKEN_MS = 12000;
const IDLE_MS = 20000;

const MODES = {
  fast:  { name:'Быстрый',   models:['openai','mistral'],
           system:'Ты быстрый и полезный ассистент. Отвечай по существу, кратко и ясно, на русском языке.' },
  code:  { name:'Код',       models:['qwen-coder','openai'],
           system:'Ты опытный программист. Пиши чистый рабочий код с короткими пояснениями на русском языке. Код оформляй в блоках с указанием языка.' },
  smart: { name:'Аналитик',  models:['deepseek','openai'],
           system:'Ты аналитик. Разбирай вопрос по шагам, структурируй ответ заголовками и списками, отвечай на русском языке.' }
};

const SUGGESTIONS = [
  ['Напиши функцию на Python','Сортировка списка словарей по полю'],
  ['Составь план','Изучение английского за 3 месяца'],
  ['Объясни простыми словами','Что такое квантовая запутанность'],
  ['Придумай идею','Небольшой стартап для студентов']
];

let state = load();
let busy = null;
let stopped = false;

function load(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  s = s && Array.isArray(s.chats) ? s : { chats:[], currentId:null, mode:'fast', theme:'dark' };
  if (!s.chats.length) s.chats.push(makeChat());
  if (!s.chats.find(c => c.id === s.currentId)) s.currentId = s.chats[s.chats.length-1].id;
  return s;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function makeChat(){ return { id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), title:'Новый чат', messages:[] }; }
function cur(){ return state.chats.find(c => c.id === state.currentId); }

function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function md(src){
  let t = esc(src || '');
  if ((t.match(/```/g) || []).length % 2) t += '\n```';
  const blocks = [];
  t = t.replace(/```([\w+#-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push(`<pre><div class="code-head"><span>${lang||'code'}</span><button class="copy" data-copy>Копировать</button></div><code>${code.replace(/\n$/,'')}</code></pre>`);
    return `\u0000${blocks.length-1}\u0000`;
  });
  t = t.replace(/`([^`\n]+)`/g, '<code class="ic">$1</code>')
       .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
       .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
       .replace(/^##? (.+)$/gm, '<h3>$1</h3>')
       .replace(/^[-*] (.+)$/gm, '<li>$1</li>')
       .replace(/\n/g, '<br>')
       .replace(/<\/li><br>/g, '</li>')
       .replace(/(<\/h[34]>)<br>/g, '$1');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

function renderAll(){
  renderSidebar();
  renderMessages();
  $('#chatTitle').textContent = cur().title;
  $('#mode').value = state.mode;
  document.documentElement.dataset.theme = state.theme;
}

function renderSidebar(){
  const q = $('#search').value.trim().toLowerCase();
  const list = $('#chatList');
  list.innerHTML = '';
  const items = [...state.chats].reverse().filter(c => !q || c.title.toLowerCase().includes(q));
  if (!items.length){ list.innerHTML = '<div class="empty-list">Ничего не найдено</div>'; return; }
  items.forEach(c => {
    const d = document.createElement('div');
    d.className = 'chat-item' + (c.id === state.currentId ? ' active' : '');
    d.innerHTML = `<span></span><button class="del" title="Удалить">✕</button>`;
    d.querySelector('span').textContent = c.title;
    d.onclick = () => selectChat(c.id);
    d.querySelector('.del').onclick = e => { e.stopPropagation(); deleteChat(c.id); };
    list.appendChild(d);
  });
}

function renderMessages(){
  const chat = cur(), box = $('#msgs');
  box.innerHTML = '';
  if (!chat.messages.length){
    const w = document.createElement('div');
    w.className = 'welcome';
    w.innerHTML = `
      <div class="big">✦</div>
      <h1>Чем могу помочь?</h1>
      <p>Выберите режим сверху и задайте вопрос</p>
      <div class="sugg-grid">${SUGGESTIONS.map(([b,s]) =>
        `<button class="sugg" data-q="${esc(b)}"><b>${esc(b)}</b><small>${esc(s)}</small></button>`).join('')}
      </div>`;
    box.appendChild(w);
    return;
  }
  chat.messages.forEach(m => box.appendChild(bubble(m)));
  scrollBottom(true);
}

function bubble(m){
  const row = document.createElement('div');
  row.className = 'row ' + m.role;
  row.innerHTML = `<div class="av">${m.role === 'user' ? 'Вы' : 'AI'}</div><div class="bubble"></div>`;
  const body = row.querySelector('.bubble');
  if (m.role === 'user') body.textContent = m.content;
  else {
    if (m.error) body.classList.add('err');
    body.innerHTML = m.error
      ? `${esc(m.content)}<br><button class="retry" data-retry>Повторить</button>`
      : md(m.content);
  }
  return row;
}

function scrollBottom(force){
  const c = $('#chat');
  if (force || c.scrollHeight - c.scrollTop - c.clientHeight < 160) c.scrollTop = c.scrollHeight;
}

function newChat(){
  if (busy) return;
  const c = makeChat();
  state.chats.push(c);
  state.currentId = c.id;
  save(); closeSidebar(); renderAll(); $('#input').focus();
}
function selectChat(id){
  if (busy) return;
  state.currentId = id; save(); closeSidebar(); renderAll();
}
function deleteChat(id){
  if (busy && id === state.currentId) return;
  state.chats = state.chats.filter(c => c.id !== id);
  if (!state.chats.length) state.chats.push(makeChat());
  if (state.currentId === id) state.currentId = state.chats[state.chats.length-1].id;
  save(); renderAll();
}

function send(text){
  text = (text ?? $('#input').value).trim();
  if (!text || busy) return;
  const chat = cur();
  $('#input').value = ''; resize();
  if (!chat.messages.length) chat.title = text.slice(0,32) + (text.length > 32 ? '…' : '');
  chat.messages.push({ role:'user', content:text });
  save();
  renderAll();
  generate(chat);
}

function retry(){
  if (busy) return;
  const chat = cur();
  if (chat.messages.at(-1)?.error) chat.messages.pop();
  renderMessages();
  generate(chat);
}

function stop(){ stopped = true; busy?.abort(); }

function setBusy(on){
  const btn = $('#sendBtn');
  btn.classList.toggle('stop', on);
  btn.textContent = on ? '■' : '➤';
  btn.title = on ? 'Остановить' : 'Отправить';
}

async function streamFrom(model, messages, signal, onDelta){
  // ОБНОВЛЕННЫЕ ШЛЮЗЫ ДЛЯ ОБХОДА БЛОКИРОВОК
  const targetUrl = 'https://gen.pollinations.ai/v1/chat/completions';
  
  const proxies = [
    `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
    `https://corsproxy.dev/?${targetUrl}`,
    `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
  ];

  let lastError = null;

  for (const proxyUrl of proxies) {
    try {
      const res = await fetch(proxyUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, messages, stream: true }),
        signal
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);

      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '', full = '', raw = '';

      while (true){
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = dec.decode(value, { stream:true });
        raw += chunk;
        buf += chunk;
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines){
          const l = line.trim();
          if (!l.startsWith('data:')) continue;
          const data = l.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            const piece = JSON.parse(data).choices?.[0]?.delta?.content;
            if (piece){ full += piece; onDelta(full); }
          } catch(e){}
        }
      }

      if (!full){
        try { full = JSON.parse(raw).choices?.[0]?.message?.content || ''; }
        catch(e){ full = raw.trim(); }
        if (full) onDelta(full);
      }
      
      if (full) return full; // Успех
      
    } catch(e) {
      lastError = e;
      console.warn('Прокси не ответил, пробуем следующий...', proxyUrl);
    }
  }
  
  throw lastError || new Error('Все прокси недоступны');
}

async function generate(chat){
  const mode = MODES[state.mode];
  const msgs = [
    { role:'system', content: mode.system },
    ...chat.messages.slice(-20).map(({role,content}) => ({ role, content }))
  ];

  const aiMsg = { role:'assistant', content:'' };
  chat.messages.push(aiMsg);
  const row = bubble(aiMsg);
  $('#msgs').appendChild(row);
  const body = row.querySelector('.bubble');
  body.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  scrollBottom(true);

  stopped = false;
  setBusy(true);

  let pending = 0;
  const paint = () => {
    if (pending) return;
    pending = requestAnimationFrame(() => {
      pending = 0;
      body.innerHTML = md(aiMsg.content) + '<span class="caret"></span>';
      scrollBottom();
    });
  };

  for (const model of mode.models){
    if (stopped) break;
    const ctrl = new AbortController();
    busy = ctrl;
    let wd = setTimeout(() => ctrl.abort(), FIRST_TOKEN_MS);
    try {
      await streamFrom(model, msgs, ctrl.signal, partial => {
        clearTimeout(wd);
        wd = setTimeout(() => ctrl.abort(), IDLE_MS);
        aiMsg.content = partial;
        paint();
      });
    } catch(e){ /* таймаут или сеть — пробуем следующую модель */ }
    finally { clearTimeout(wd); }
    if (aiMsg.content.trim()) break;
  }

  busy = null;
  setBusy(false);

  if (!aiMsg.content.trim()){
    if (stopped){ chat.messages.pop(); }
    else {
      aiMsg.error = true;
      aiMsg.content = 'Не удалось получить ответ. Проверьте интернет и попробуйте ещё раз.';
    }
  }
  save();
  renderAll();
}

function resize(){
  const i = $('#input');
  i.style.height = 'auto';
  i.style.height = Math.min(i.scrollHeight, 200) + 'px';
}
function openSidebar(){ $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); }
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }

function exportChat(){
  const c = cur();
  const text = `# ${c.title}\n\n` + c.messages.map(m =>
    `**${m.role === 'user' ? 'Вы' : 'ИИ'}:**\n${m.content}`).join('\n\n---\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:'text/markdown' }));
  a.download = (c.title || 'chat').replace(/[\\/:*?"<>|]/g,'') + '.md';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$('#newBtn').onclick = newChat;
$('#search').oninput = renderSidebar;
$('#menuBtn').onclick = openSidebar;
$('#overlay').onclick = closeSidebar;
$('#exportBtn').onclick = exportChat;
$('#themeBtn').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  save(); document.documentElement.dataset.theme = state.theme;
};
$('#clearBtn').onclick = () => {
  if (busy || !confirm('Удалить все чаты?')) return;
  state.chats = [makeChat()]; state.currentId = state.chats[0].id;
  save(); renderAll();
};
$('#mode').onchange = e => { state.mode = e.target.value; save(); };
$('#sendBtn').onclick = () => busy ? stop() : send();

const input = $('#input');
input.addEventListener('input', resize);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    send();
  }
});

$('#msgs').addEventListener('click', e => {
  const sugg = e.target.closest('.sugg');
  if (sugg) return send(sugg.dataset.q);
  if (e.target.closest('[data-retry]')) return retry();
  const copy = e.target.closest('[data-copy]');
  if (copy){
    const code = copy.closest('pre').querySelector('code').innerText;
    navigator.clipboard?.writeText(code).then(() => {
      copy.textContent = 'Скопировано ✓';
      setTimeout(() => copy.textContent = 'Копировать', 1500);
    });
  }
});

renderAll();
input.focus();
</script>
</body>
</html>
